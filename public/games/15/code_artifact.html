<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無限ガチャガチャドリーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
        }

        /* SSR / Rare Animations */
        @keyframes rainbow-border {
            0% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
            20% { border-color: #ffff00; box-shadow: 0 0 20px #ffff00; }
            40% { border-color: #00ff00; box-shadow: 0 0 20px #00ff00; }
            60% { border-color: #00ffff; box-shadow: 0 0 20px #00ffff; }
            80% { border-color: #ff00ff; box-shadow: 0 0 20px #ff00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
        }

        @keyframes rainbow-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .ssr-rainbow {
            background: linear-gradient(-45deg, #ff0055, #ffdd00, #00ffaa, #00aaff, #ff00ff);
            background-size: 300% 300%;
            animation: rainbow-bg 2s ease infinite;
        }

        .ssr-card {
            animation: rainbow-border 1.5s infinite linear;
        }

        /* Secret Carrot Rainbow Effect */
        @keyframes carrot-glow {
            0% { box-shadow: 0 0 30px #ff6600, 0 0 60px #ffcc00; border-color: #ffaa00; }
            50% { box-shadow: 0 0 50px #ff0055, 0 0 100px #ffaa00; border-color: #ffffff; }
            100% { box-shadow: 0 0 30px #ff6600, 0 0 60px #ffcc00; border-color: #ffaa00; }
        }

        .secret-card {
            animation: carrot-glow 1s infinite alternate;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-8px, 5px) rotate(-5deg); }
            40% { transform: translate(8px, -5px) rotate(5deg); }
            60% { transform: translate(-5px, 8px) rotate(-3deg); }
            80% { transform: translate(5px, -3px) rotate(3deg); }
        }

        .shake-extreme {
            animation: shake 0.15s ease-in-out infinite;
        }

        @keyframes handle-turn {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .turning {
            animation: handle-turn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes flash-cutin {
            0% { opacity: 0; transform: scale(2) rotate(-10deg); }
            50% { opacity: 1; transform: scale(1) rotate(0deg); }
            100% { opacity: 0; transform: scale(0.8) rotate(5deg); }
        }

        .cutin-active {
            animation: flash-cutin 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Canvas Overlay */
        #fx-canvas {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 50;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between overflow-x-hidden relative">

    <canvas id="fx-canvas"></canvas>

    <!-- Header / Stats Bar -->
    <header class="w-full max-w-4xl p-4 flex justify-between items-center bg-slate-800/80 backdrop-blur-md rounded-b-2xl border-b border-slate-700 shadow-lg z-10 mt-0">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-amber-500 to-yellow-300 p-3 rounded-2xl shadow-md text-slate-900">
                <i class="fa-solid font-black fa-box-open text-2xl"></i>
            </div>
            <div>
                <h1 class="font-black text-xl md:text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-orange-500">
                    無限ガチャガチャ
                </h1>
                <p class="text-xs text-slate-400">昇格・リーチ・神ガチャモード搭載！</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="bg-slate-900/90 px-4 py-2 rounded-xl border border-slate-700 text-right">
                <div class="text-xs text-slate-400">総回転数</div>
                <div id="total-count" class="font-black text-xl text-amber-400">0 回</div>
            </div>
            <button id="btn-collection" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all text-white font-bold px-4 py-2.5 rounded-xl flex items-center gap-2 shadow-lg border border-indigo-400">
                <i class="fa-solid fa-book-open"></i>
                <span class="hidden sm:inline">図鑑</span>
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-4xl flex-1 flex flex-col md:flex-row items-center justify-center gap-8 p-4 z-10 my-auto">
        
        <!-- Left: Gacha Machine Visual -->
        <div class="relative w-72 sm:w-80 flex flex-col items-center">
            <!-- Machine Top Decor -->
            <div class="w-full bg-gradient-to-r from-red-600 via-pink-500 to-red-600 h-8 rounded-t-3xl border-b-2 border-red-800 shadow-md"></div>

            <!-- Capsule Chamber (Glass) -->
            <div class="relative w-full h-64 bg-slate-800/60 backdrop-blur-md rounded-b-2xl border-4 border-slate-700 flex items-center justify-center overflow-hidden shadow-2xl">
                <div class="absolute inset-0 bg-gradient-to-b from-white/10 to-transparent pointer-events-none"></div>
                
                <!-- Inner Capsules Floating Visual -->
                <div id="capsule-chamber" class="w-full h-full relative p-4 flex flex-wrap justify-center items-center gap-2">
                    <!-- Capsules generated via JS -->
                </div>

                <!-- Glow/Flash Light inside Chamber -->
                <div id="chamber-glow" class="absolute inset-0 opacity-0 transition-opacity duration-300 pointer-events-none"></div>
            </div>

            <!-- Machine Base & Handle -->
            <div class="w-full bg-slate-800 border-4 border-t-0 border-slate-700 rounded-b-3xl p-4 flex flex-col items-center shadow-2xl relative">
                <!-- Handle Mechanism -->
                <div class="relative my-2">
                    <div class="w-20 h-20 rounded-full bg-slate-700 border-4 border-slate-600 flex items-center justify-center shadow-inner">
                        <button id="gacha-handle" class="w-16 h-16 rounded-full bg-gradient-to-br from-amber-400 to-orange-600 border-2 border-amber-200 shadow-lg flex items-center justify-center active:scale-95 transition-transform cursor-pointer">
                            <div class="w-12 h-3 bg-white/80 rounded-full shadow-md transform -rotate-45 pointer-events-none"></div>
                        </button>
                    </div>
                </div>

                <!-- Exit Slot -->
                <div class="w-28 h-12 bg-slate-900 rounded-b-lg border-2 border-slate-700 flex items-end justify-center pb-1 shadow-inner relative overflow-hidden">
                    <div id="dispensed-capsule" class="w-8 h-8 rounded-full hidden transform translate-y-10 transition-all duration-500 shadow-lg"></div>
                </div>
            </div>
        </div>

        <!-- Right: Action Buttons & Quick Stats -->
        <div class="flex flex-col gap-4 w-full max-w-sm">
            <!-- Mode Selector / Rate Display -->
            <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 shadow-xl space-y-3">
                <!-- Toggle Mode Tabs -->
                <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-700">
                    <button id="btn-mode-normal" class="flex-1 py-1.5 text-xs font-black rounded-lg bg-amber-500 text-slate-950 shadow transition-all">
                        通常ガチャ
                    </button>
                    <button id="btn-mode-god" class="flex-1 py-1.5 text-xs font-black rounded-lg text-slate-400 hover:text-white transition-all flex items-center justify-center gap-1">
                        <i class="fa-solid fa-bolt text-amber-400"></i> 神ガチャ (20%)
                    </button>
                </div>

                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center justify-between">
                    <span><i class="fa-solid fa-sliders text-amber-400"></i> 排出確率一覧</span>
                    <span id="rate-mode-label" class="text-amber-400 font-black">【通常モード】</span>
                </h2>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="bg-gradient-to-r from-orange-900/60 to-amber-900/60 p-2 rounded-lg border border-orange-500/50 flex justify-between items-center col-span-2">
                        <span class="font-black text-amber-300 flex items-center gap-1">🥕 伝説のシークレット</span>
                        <span id="rate-secret" class="font-bold text-amber-300">0.01%</span>
                    </div>
                    <div class="bg-gradient-to-r from-red-900/50 to-pink-900/50 p-2 rounded-lg border border-red-500/40 flex justify-between items-center">
                        <span class="font-black text-pink-400">SSR (超神級)</span>
                        <span id="rate-ssr" class="font-bold text-slate-300">1.0%</span>
                    </div>
                    <div class="bg-gradient-to-r from-amber-900/50 to-yellow-900/50 p-2 rounded-lg border border-amber-500/40 flex justify-between items-center">
                        <span class="font-black text-amber-400">SR (超激レア)</span>
                        <span id="rate-sr" class="font-bold text-slate-300">4.0%</span>
                    </div>
                    <div class="bg-gradient-to-r from-purple-900/50 to-indigo-900/50 p-2 rounded-lg border border-purple-500/40 flex justify-between items-center">
                        <span class="font-black text-purple-300">R (激レア)</span>
                        <span id="rate-r" class="font-bold text-slate-300">20.0%</span>
                    </div>
                    <div class="bg-gradient-to-r from-slate-700/50 to-slate-800/50 p-2 rounded-lg border border-slate-600/40 flex justify-between items-center">
                        <span class="font-black text-slate-300">S (ノーマル)</span>
                        <span id="rate-s" class="font-bold text-slate-300">74.99%</span>
                    </div>
                </div>
            </div>

            <!-- Gacha Buttons -->
            <div class="flex flex-col gap-3">
                <button id="btn-pull-1" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 active:scale-95 transition-all font-black text-xl shadow-lg shadow-amber-500/20 border-b-4 border-amber-700 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> 1回まわす！
                </button>
                <div class="grid grid-cols-2 gap-3">
                    <button id="btn-pull-10" class="py-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-95 transition-all font-bold text-lg shadow-lg shadow-indigo-500/20 border-b-4 border-indigo-800 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bolt"></i> 10連ガチャ
                    </button>
                    <button id="btn-pull-100" class="py-3 rounded-2xl bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 active:scale-95 transition-all font-bold text-lg shadow-lg shadow-pink-500/20 border-b-4 border-pink-800 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-fire-flame-curved"></i> 100連ガチャ
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 text-center text-xs text-slate-500 z-10">
        無限ガチャガチャドリーム &copy; 2026 - 完全無料・無制限
    </footer>

    <!-- SSR Cut-In Overlay -->
    <div id="cutin-overlay" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center overflow-hidden pointer-events-none">
        <div id="cutin-bg" class="absolute inset-0 opacity-80"></div>
        <div id="cutin-text" class="text-center z-10">
            <h2 id="cutin-title" class="text-6xl sm:text-8xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-300 to-red-500 drop-shadow-[0_10px_20px_rgba(255,215,0,0.8)] uppercase">
                神・超・激・強！！
            </h2>
            <p id="cutin-sub" class="text-2xl sm:text-4xl font-bold text-white tracking-widest mt-4 drop-shadow-md">
                SSR 確定超極致演出
            </p>
        </div>
    </div>

    <!-- Upgrade / Reach Tension Overlay -->
    <div id="tension-overlay" class="fixed inset-0 bg-black/80 z-50 hidden flex-col items-center justify-center pointer-events-none">
        <div id="tension-text" class="text-amber-400 text-4xl sm:text-6xl font-black tracking-widest animate-ping">
            昇 格 確 变 ! ?
        </div>
    </div>

    <!-- Single Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-40 hidden flex items-center justify-center p-4">
        <div id="result-card" class="bg-slate-800 border-4 border-slate-700 rounded-3xl p-6 sm:p-8 max-w-sm w-full flex flex-col items-center text-center shadow-2xl relative transform transition-all scale-100 opacity-100">
            <span id="res-rank-badge" class="px-4 py-1.5 rounded-full font-black text-sm tracking-widest uppercase mb-4 shadow-md">
                S RANK
            </span>

            <div id="res-icon-container" class="w-32 h-32 rounded-2xl bg-slate-900 border-2 border-slate-700 flex items-center justify-center my-4 shadow-inner relative overflow-hidden">
                <i id="res-icon" class="fa-solid fa-star text-6xl text-amber-400"></i>
            </div>

            <h3 id="res-title" class="text-2xl font-black text-white mb-2">伝説のドラゴンsword</h3>
            <p id="res-desc" class="text-sm text-slate-300 mb-6">神々の時代から受け継がれし究極の剣。一振りが天を裂く。</p>

            <button id="btn-close-result" class="w-full py-3 rounded-xl bg-slate-700 hover:bg-slate-600 font-bold text-white transition-all shadow-md active:scale-95 cursor-pointer">
                次へ進む
            </button>
        </div>
    </div>

    <!-- Multi Result Modal (10 / 100 Pulls) -->
    <div id="multi-result-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-40 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800/90 border-2 border-slate-700 rounded-3xl p-6 max-w-2xl w-full flex flex-col max-h-[85vh] shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                <h3 class="text-xl font-black text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-boxes-packing"></i> ガチャ獲得結果一覧
                </h3>
                <span id="multi-count-label" class="text-sm font-bold text-slate-400">10連結果</span>
            </div>

            <div id="multi-grid" class="grid grid-cols-2 sm:grid-cols-5 gap-3 overflow-y-auto p-2 flex-1">
                <!-- Cards appended via JS -->
            </div>

            <button id="btn-close-multi" class="mt-4 w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 font-black text-slate-900 transition-all shadow-lg active:scale-95 cursor-pointer">
                確認して戻る
            </button>
        </div>
    </div>

    <!-- Collection / Picture Book Modal -->
    <div id="collection-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-40 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border-2 border-slate-700 rounded-3xl p-6 max-w-3xl w-full flex flex-col max-h-[85vh] shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                <div>
                    <h3 class="text-xl font-black text-white flex items-center gap-2">
                        <i class="fa-solid fa-book-open text-indigo-400"></i> カプセル図鑑
                    </h3>
                    <p id="collection-stats" class="text-xs text-slate-400">コンプリート率: 0% (0/0)</p>
                </div>
                <button id="btn-close-collection" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold flex items-center justify-center transition-all cursor-pointer">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Filter Tabs -->
            <div id="filter-container" class="flex gap-2 mb-4 overflow-x-auto pb-1">
                <button class="col-filter-btn px-3 py-1 rounded-lg text-xs font-bold bg-indigo-600 text-white" data-rank="ALL">すべて</button>
                <button class="col-filter-btn px-3 py-1 rounded-lg text-xs font-bold bg-slate-700 text-slate-300" data-rank="SECRET">🥕</button>
                <button class="col-filter-btn px-3 py-1 rounded-lg text-xs font-bold bg-slate-700 text-slate-300" data-rank="SSR">SSR</button>
                <button class="col-filter-btn px-3 py-1 rounded-lg text-xs font-bold bg-slate-700 text-slate-300" data-rank="SR">SR</button>
                <button class="col-filter-btn px-3 py-1 rounded-lg text-xs font-bold bg-slate-700 text-slate-300" data-rank="R">R</button>
                <button class="col-filter-btn px-3 py-1 rounded-lg text-xs font-bold bg-slate-700 text-slate-300" data-rank="S">S</button>
            </div>

            <!-- Collection Grid -->
            <div id="collection-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3 overflow-y-auto p-2 flex-1">
                <!-- Items populated via JS -->
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Sound Synthesizer
        class AudioEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playGachaTurn() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playCapsuleDrop() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playCutinSound() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.4);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.8);
            }

            playCarrotSound() {
                this.init();
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                    gain.gain.setValueAtTime(0.4, now + idx * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.8);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.05);
                    osc.stop(now + idx * 0.05 + 0.8);
                });
            }

            playTensionSound() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            playFanfare(rank) {
                this.init();
                const now = this.ctx.currentTime;
                
                if (rank === 'SSR') {
                    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.3, now + idx * 0.08);
                        gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.4);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.4);
                    });
                } else if (rank === 'SR') {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.3, now + idx * 0.1);
                        gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.3);
                    });
                } else {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

        function triggerConfetti(colors, count = 100) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    decay: Math.random() * 0.015 + 0.005
                });
            }
        }

        function updateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // Gravity
                p.rotation += p.vRot;
                p.life -= p.decay;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.life <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(updateParticles);
        }
        requestAnimationFrame(updateParticles);

        async function pullGacha(count) {
            if (state.isSpinning) return;
            state.isSpinning = true;

            const items = [];
            let highestRank = 'S';
            const rankPriority = { 'SECRET': 4, 'SSR': 3, 'SR': 2, 'R': 1, 'S': 0 };

            for (let i = 0; i < count; i++) {
                const item = getRandomItem();
                items.push(item);
                if (rankPriority[item.rank] > rankPriority[highestRank]) {
                    highestRank = item.rank;

            await playGachaAnimation(highestRank);

            if (count === 1) {
                showSingleResult(items[0]);
            } else {
                showMultiResult(items);
            }

            state.isSpinning = false;
        }

            document.getElementById('gacha-handle').addEventListener('click', () => pullGacha(1));

            // Close Modals
            document.getElementById('btn-close-result').addEventListener('click', () => {
                document.getElementById('result-modal').classList.add('hidden');
            });
            document.getElementById('btn-close-multi').addEventListener('click', () => {
                document.getElementById('multi-result-modal').classList.add('hidden');
            });

            // Collection Modal
            document.getElementById('btn-collection').addEventListener('click', () => {
                renderCollection();
                document.getElementById('collection-modal').classList.remove('hidden');
                document.getElementById('collection-modal').classList.add('flex');
            });
            document.getElementById('btn-close-collection').addEventListener('click', () => {
                document.getElementById('collection-modal').classList.add('hidden');
            });

            // Mode Toggle
            btnNormal.addEventListener('click', () => {
                state.mode = 'NORMAL';
                updateModeUI();
            });

            btnGod.addEventListener('click', () => {
                state.mode = 'GOD';
                updateModeUI();
            });

            // Filter Tabs
            document.querySelectorAll('.col-filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.col-filter-btn').forEach(b => {
                        b.className = "col-filter-btn px-3 py-1 rounded-lg text-xs font-bold bg-slate-700 text-slate-300";
                    });
                    e.target.className = "col-filter-btn px-3 py-1 rounded-lg text-xs font-bold bg-indigo-600 text-white";
                    state.currentFilter = e.target.getAttribute('data-rank');
                    renderCollection();
                });
            });
        };
    </script>
</body>
</html>
