<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSQUITO ESCAPE - 蚊の選択 (5人・5ステップ5択版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0d1117;
            color: #f0f6fc;
            user-select: none;
        }
        .font-pixel {
            font-family: 'DotGothic16', sans-serif;
        }
        .blood-card {
            background: linear-gradient(135deg, rgba(30, 10, 15, 0.95), rgba(15, 23, 42, 0.95));
            border: 2px solid rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.2);
        }
        .choice-btn {
            transition: all 0.2s ease-in-out;
        }
        .choice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            border-color: #ef4444;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .slapped-shake {
            animation: shake 0.5s;
        }
        @keyframes rainbow {
            0% { border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
            50% { border-color: #eab308; box-shadow: 0 0 25px rgba(234, 179, 8, 0.8); }
            100% { border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
        }
        .king-card {
            animation: rainbow 3s infinite ease-in-out;
            background: linear-gradient(135deg, rgba(45, 20, 5, 0.95), rgba(15, 23, 42, 0.98));
        }

        /* カスタムスクロールバー（図鑑用） */
        #collection-list::-webkit-scrollbar {
            width: 6px;
        }
        #collection-list::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
        }
        #collection-list::-webkit-scrollbar-thumb {
            background: rgba(234, 179, 8, 0.4);
            border-radius: 8px;
        }
        #collection-list::-webkit-scrollbar-thumb:hover {
            background: rgba(234, 179, 8, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 overflow-x-hidden">

            </div>

    <script>
        // Web Audio API Sound Effects
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        // Initialize Audio Context on user interaction
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        // Timer Variables
        let timerInterval = null;
        let timeLeft = 60;

        function startTimer() {
            stopTimer();
            timeLeft = 60;
            const timerBox = document.getElementById('timer-box');
            const timerText = document.getElementById('timer-text');
            timerBox.classList.remove('hidden');
            timerText.innerText = `${timeLeft}s`;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerText.innerText = `${timeLeft}s`;

                if (timeLeft <= 10) {
                    timerBox.classList.add('bg-red-600', 'text-white', 'border-white');
                    timerBox.classList.remove('bg-red-950/80', 'text-red-400', 'border-red-500/50');
                } else {
                    timerBox.classList.remove('bg-red-600', 'text-white', 'border-white');
                    timerBox.classList.add('bg-red-950/80', 'text-red-400', 'border-red-500/50');
                }

                if (timeLeft <= 0) {
                    stopTimer();
                    handleTimeOut();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            const timerBox = document.getElementById('timer-box');
            if (timerBox) timerBox.classList.add('hidden');
        }

        function handleTimeOut() {
            initAudio();
            playSlapSound();
            showBadEnd({
                title: "BAD END: タイムアップ（迷いによる死亡）",
                desc: "60秒間迷ってホバリングしている間に羽音で完全に警戒され、容赦ない両手挟み撃ち（拍手）で潰された！蚊の世界に「迷い」は禁物だ。"
            });
        }

        function playBuzzSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(260, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSlapSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            // 1. スラップ衝撃ノイズ (平手打ち・拍手音)
            const bufferSize = audioCtx.sampleRate * 0.25;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.Q.setValueAtTime(1.5, now);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.8, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

            whiteNoise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            whiteNoise.start(now);

            // 2. ズシーンという重低音インパクト (ゲームオーバー感の強調)
            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            subOsc.type = 'triangle';
            subOsc.frequency.setValueAtTime(160, now);
            subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.3);

            subGain.gain.setValueAtTime(0.7, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            subOsc.connect(subGain);
            subGain.connect(audioCtx.destination);
            subOsc.start(now);
            subOsc.stop(now + 0.3);
        }

        function playSuccessSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            // 明るく気持ち良いクリアコード（Cメジャー7thアルペジオ + ピッチシフト）
            const notes = [523.25, 659.25, 783.99, 987.77, 1046.50]; // C5, E5, G5, B5, C6
            
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine'; // まろやかでクリスタルなサウンド
                osc.frequency.setValueAtTime(freq, now + idx * 0.06);
                
                gain.gain.setValueAtTime(0.2, now + idx * 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.3);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now + idx * 0.06);
                osc.stop(now + idx * 0.06 + 0.3);
            });
        }

        function playKingFanfare() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [440, 554.37, 659.25, 880, 880, 880, 1108.73];
            const times = [0, 0.15, 0.3, 0.45, 0.6, 0.75, 0.9];
            const durations = [0.12, 0.12, 0.12, 0.12, 0.12, 0.12, 0.5];

            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now + times[idx]);
                gain.gain.setValueAtTime(0.2, now + times[idx]);
                gain.gain.exponentialRampToValueAtTime(0.01, now + times[idx] + durations[idx]);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + times[idx]);
                osc.stop(now + times[idx] + durations[idx]);
            });
        }

        // Track Cleared Targets
        const clearedTargets = {
            student: false,
            macho: false,
            gamer: false,
            drunk: false,
            catowner: false
        };

        // Track Unlocked Endings (Total 26)
        const unlockedEndings = new Set();

        // Game State Variables
        let currentState = 'select_target'; // 'select_target', 'in_step', 'ending'
        let currentTargetKey = null;
        let currentStepIndex = 0;

        // Select Target Function
        function selectTarget(targetKey) {
            initAudio();
            playBuzzSound();
            currentTargetKey = targetKey;
            currentStepIndex = 0;
            currentState = 'in_step';
            renderUI();
        }

        // Target Info Definitions
        const targetsInfo = {
            student: { name: '勉強中の受験生', icon: 'fa-user-graduate', color: 'text-blue-400' },
            macho: { name: '筋トレ中の筋肉男', icon: 'fa-dumbbell', color: 'text-red-400' },
            gamer: { name: 'ゲーム没頭ゲーマー', icon: 'fa-gamepad', color: 'text-purple-400' },
            drunk: { name: '酔っ払いの会社員', icon: 'fa-beer-mug-empty', color: 'text-amber-400' },
            catowner: { name: 'ネコと遊ぶ飼い主', icon: 'fa-cat', color: 'text-emerald-400' }
        };

        // All 26 Endings List Definition for Collection Screen
        const allEndingsList = [
            // Student
            { id: 'student_bad_1', target: 'student', type: 'bad', title: "BAD END 1: 視界で即撃墜", desc: "動く目線に引っかかり、ノートを丸めてパンチされて即死した。" },
            { id: 'student_bad_2', target: 'student', type: 'bad', title: "BAD END 2: 首筋への反射叩き", desc: "チクッとした瞬間に無意識の手が飛んできて叩き潰された。" },
            { id: 'student_bad_3', target: 'student', type: 'bad', title: "BAD END 3: 静寂の痛み", desc: "しんと静まり返った部屋では微小な痒みも目立ち即死。" },
            { id: 'student_bad_4', target: 'student', type: 'bad', title: "BAD END 4: 重すぎて飛ばず", desc: "血を吸いすぎて重くなり、飛び立った瞬間に床へ落下し踏まれた。" },
            { id: 'student_success', target: 'student', type: 'success', title: "SUCCESS: 受験生の血を制覇", desc: "集中している受験生の足を刺し、影の中へ無事脱出完了！" },

            // Macho
            { id: 'macho_bad_1', target: 'macho', type: 'bad', title: "BAD END 1: 息圧で吹っ飛ぶ", desc: "「ヌン！」という熱い鼻息の風圧で壁に激突し脳震盪を起こした。" },
            { id: 'macho_bad_2', target: 'macho', type: 'bad', title: "BAD END 2: 筋肉の硬化", desc: "力を込めた瞬間に筋肉が鉄のように硬くなり針が折れた。" },
            { id: 'macho_bad_3', target: 'macho', type: 'bad', title: "BAD END 3: 鏡越しに発見", desc: "鏡に映った蚊の姿を見逃さず叩き潰された。" },
            { id: 'macho_bad_4', target: 'macho', type: 'bad', title: "BAD END 4: 内圧破裂", desc: "マッチョの高血圧に耐え切れず蚊のお腹が破裂した。" },
            { id: 'macho_success', target: 'macho', type: 'success', title: "SUCCESS: 筋肉男の血を制覇", desc: "高タンパクな血液をGET！筋肉ベンチの影へ見事退避！" },

            // Gamer
            { id: 'gamer_bad_1', target: 'gamer', type: 'bad', title: "BAD END 1: モニター熱と光", desc: "画面の強い光で目がくらみキーボードの上に落下、叩かれた。" },
            { id: 'gamer_bad_2', target: 'gamer', type: 'bad', title: "BAD END 2: エイムの犠牲", desc: "激しいエイム操作で振り回され壁に激突した。" },
            { id: 'gamer_bad_3', target: 'gamer', type: 'bad', title: "BAD END 3: 暗転の恐怖", desc: "画面が暗くなり肘の異物に速攻で気づかれた。" },
            { id: 'gamer_bad_4', target: 'gamer', type: 'bad', title: "BAD END 4: 筋肉の緊張", desc: "ゲーマーが力んだ瞬間に腕の筋が張り針が抜けない。" },
            { id: 'gamer_success', target: 'gamer', type: 'success', title: "SUCCESS: ゲーマーの血を制覇", desc: "カフェインたっぷりの血を味わい、PCケース裏に生還！" },

            // Drunk

        function handleTimeOut() {
            initAudio();
            playSlapSound();
            showBadEnd({
                id: 'timeout_bad',
                title: "BAD END: タイムアップ（迷いによる死亡）",

            });
        }

        // Show Bad End Function
        function showBadEnd(badEndData) {
            currentState = 'ending';
            if (badEndData.id) {
                unlockedEndings.add(badEndData.id);
            }
            renderUI();

            const gameCard = document.getElementById('game-card');
            gameCard.classList.add('slapped-shake');
            setTimeout(() => {
                gameCard.classList.remove('slapped-shake');
            }, 500);

            document.getElementById('ending-badge').className = "inline-block px-4 py-1 rounded-full text-xs font-bold font-pixel mb-2 bg-red-950 border border-red-600 text-red-400";
            document.getElementById('ending-badge').innerText = "BAD END (叩かれ即死)";
            document.getElementById('ending-title').innerText = badEndData.title;
            document.getElementById('ending-desc').innerText = badEndData.desc;

            document.getElementById('scene-bg-icon').innerHTML = `<i class="fa-solid fa-skull-crossbones text-red-600 animate-pulse"></i>`;
            document.getElementById('target-status-badge').innerText = "吸血失敗・死亡";
            document.getElementById('next-target-btn').style.display = 'flex';
        }

        function handleChoice(choice) {
            initAudio();
            if (choice.badEnd) {
                playSlapSound();
                showBadEnd(choice.badEnd);
            } else if (choice.success) {
                clearedTargets[currentTargetKey] = true;
                if (choice.successId) unlockedEndings.add(choice.successId);
                
                const clearedCount = updateProgressUI();
                if (clearedCount >= 5) {
                    playKingFanfare();
                    showKingEnding();
                } else {
                    playSuccessSound();
                    showSuccessEnd();
                }
            } else if (choice.nextStep !== undefined) {
                playBuzzSound();
                currentStepIndex = choice.nextStep;
                renderUI();
            }
        }

        // Fisher-Yates Shuffle Algorithm for Randomizing Choices
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

                    btn.innerHTML = `
                        <span class="group-hover:text-red-300 transition">${choice.text}</span>
                        <i class="fa-solid fa-angles-right text-slate-600 group-hover:text-red-400 text-xs"></i>
                    `;
                    btn.onclick = () => handleChoice(choice);
                    choicesContainer.appendChild(btn);
                });
            } else if (currentState === 'ending') {
                stopTimer();
                choicesContainer.classList.add('hidden');
                endingContainer.classList.remove('hidden');
            }
        }

        function showSuccessEnd() {
            currentState = 'ending';
            renderUI();

            document.getElementById('ending-badge').className = "inline-block px-4 py-1 rounded-full text-xs font-bold font-pixel mb-2 bg-emerald-950 border border-emerald-500 text-emerald-400";
            document.getElementById('ending-badge').innerText = "MISSION SUCCESS (吸血・脱出成功)";
            document.getElementById('ending-title').innerText = "血を吸い尽くして生還！";
            document.getElementById('ending-desc').innerText = `【サバイバル成功】\n人間の目を鮮やかにあざむき、新鮮で上質な血をたっぷり吸うことに成功した！あなたは闇の中へ消えていった……。（満腹度 +20%）`;

            document.getElementById('scene-bg-icon').innerHTML = `<i class="fa-solid fa-droplet text-red-500 animate-bounce"></i>`;
            document.getElementById('target-status-badge').innerText = "満腹度アップ！";
            document.getElementById('next-target-btn').style.display = 'flex';
        }

        function showKingEnding() {
            currentState = 'ending';
            renderUI();

            const gameCard = document.getElementById('game-card');
            gameCard.className = "w-full max-w-xl king-card rounded-3xl p-5 sm:p-8 relative overflow-hidden my-auto border transition-all duration-500";

            document.getElementById('ending-badge').className = "inline-block px-4 py-1 rounded-full text-xs font-bold font-pixel mb-2 bg-yellow-500 text-black font-black animate-pulse";
            document.getElementById('ending-badge').innerText = "👑 TRUE HAPPY END (満腹度 100%)";
            document.getElementById('ending-title').innerText = "👑 蚊の王様 (KING OF MOSQUITOES)";
            document.getElementById('ending-desc').innerText = "【伝説達成】\n部屋にいた5人の人間（受験生・筋肉男・ゲーマー・酔っ払い・飼い主）すべての命がけの防衛網を突破し、完全ノーミスで血を吸い尽くした！あなたは今夜、生態系の頂点に立つ「蚊の王様」となった！";

            document.getElementById('scene-bg-icon').innerHTML = `<i class="fa-solid fa-crown text-yellow-400 text-6xl animate-bounce"></i>`;
            document.getElementById('target-status-badge').innerText = "完全制覇 - FULLY SATISFIED";
            document.getElementById('next-target-btn').style.display = 'none';
        }

        function updateProgressUI() {
            let clearedCount = 0;
            for (const key in clearedTargets) {
                const badgeEl = document.getElementById(`badge-${key}`);
                if (clearedTargets[key]) {
                    clearedCount++;
                    if (badgeEl) {
                        badgeEl.className = "flex flex-col items-center opacity-100 font-bold text-yellow-400 transition-all duration-300 scale-110";
                        badgeEl.querySelector('i').className = "fa-solid fa-crown text-yellow-400 text-base mb-0.5 animate-bounce";
                    }
                }
            }
            const fullnessPercent = clearedCount * 20;
            document.getElementById('cleared-count').innerText = `${fullnessPercent}%`;
            return clearedCount;
        }

        // Collection Modal Render
        function updateCollectionUI() {
            const listEl = document.getElementById('collection-list');
            const rateTextEl = document.getElementById('collection-rate-text');
            const badgeCountEl = document.getElementById('collection-badge-count');

            if (!listEl) return;

            listEl.innerHTML = '';
            const unlockedCount = unlockedEndings.size;
            const totalCount = allEndingsList.length;
            const percentage = Math.round((unlockedCount / totalCount) * 100);

            rateTextEl.innerText = `${unlockedCount} / ${totalCount} (${percentage}%)`;
            badgeCountEl.innerText = `${unlockedCount}/${totalCount}`;

            allEndingsList.forEach((item) => {
                const isUnlocked = unlockedEndings.has(item.id);
                const card = document.createElement('div');

                if (isUnlocked) {
                    const isSuccess = item.type === 'success';
                    card.className = `p-3 rounded-xl border ${isSuccess ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-200' : 'bg-red-950/40 border-red-800/50 text-slate-200'}`;
                    card.innerHTML = `
                        <div class="flex items-center justify-between font-pixel font-bold mb-1">
                            <span class="${isSuccess ? 'text-emerald-400' : 'text-red-400'}">${item.title}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded ${isSuccess ? 'bg-emerald-900 text-emerald-300' : 'bg-red-900 text-red-300'}">${isSuccess ? 'SUCCESS' : 'BAD END'}</span>
                        </div>
                        <p class="text-[11px] text-slate-300 leading-snug">${item.desc}</p>
                    `;
                } else {
                    card.className = "p-3 rounded-xl border bg-slate-950 border-slate-800 text-slate-600";
                    card.innerHTML = `
                        <div class="flex items-center justify-between font-pixel font-bold mb-1">
                            <span>??? [未解放]</span>
                            <i class="fa-solid fa-lock text-slate-600 text-xs"></i>
                        </div>
                        <p class="text-[11px] text-slate-700">このエンディングはまだ発見されていません。</p>
                    `;
                }
                listEl.appendChild(card);
            });
        }

        // Reset progress and collection on retry
        function resetAllProgress() {
            unlockedEndings.clear();
            for (const key in clearedTargets) {
                clearedTargets[key] = false;
                const badgeEl = document.getElementById(`badge-${key}`);
                if (badgeEl) {
                    badgeEl.className = "flex flex-col items-center opacity-40 transition-all duration-300";
                    const iconEl = badgeEl.querySelector('i');
                    if (iconEl) {
                        const originalIcons = {
                            student: 'fa-user-graduate',
                            macho: 'fa-dumbbell',
                            gamer: 'fa-gamepad',
                            drunk: 'fa-beer-mug-empty',
                            catowner: 'fa-cat'
                        };
                        iconEl.className = `fa-solid ${originalIcons[key]} text-slate-400 text-base mb-0.5`;
                    }
                }
            }
            updateProgressUI();
            updateCollectionUI();
        }

        // Event Listeners for Collection Modal
        document.getElementById('open-collection-btn').addEventListener('click', () => {
            initAudio();
            updateCollectionUI();
            document.getElementById('collection-modal').classList.remove('hidden');
        });

        document.getElementById('close-collection-btn').addEventListener('click', () => {
            document.getElementById('collection-modal').classList.add('hidden');
        });

        // Retry button (resets all progress for 100% full challenge)
        document.getElementById('retry-btn').addEventListener('click', () => {
            initAudio();
            playBuzzSound();
            resetAllProgress();
            currentState = 'select_target';
            renderUI();
        });

        // Next target (Go to select screen)
        document.getElementById('next-target-btn').addEventListener('click', () => {
            initAudio();
            playBuzzSound();
            currentState = 'select_target';
            renderUI();
        });

        // Initialize Game
        window.onload = () => {
            updateProgressUI();
            updateCollectionUI();
            renderUI();
        };
    </script>
</body>
</html>
