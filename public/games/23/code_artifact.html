<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>インベーダーV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #1a1a2e;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        /* タッチコントローラのスタイリング */
        .touch-btn {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            active-bg: rgba(255, 255, 255, 0.5);
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen m-0 p-0 text-white select-none">

    <!-- ゲーム画面コンテナ -->
    <div id="game-container" class="relative w-full max-w-4xl h-[100vh] max-h-[600px] bg-slate-900 rounded-lg overflow-hidden shadow-2xl flex flex-col justify-between">
        
        <!-- CANVAS -->
        <canvas id="gameCanvas" class="w-full h-full absolute inset-0 z-0"></canvas>

        <!-- UIオーバーレイ (死亡回数・ステージ情報) -->
        <div class="relative z-10 flex justify-between items-center p-4 text-white font-bold drop-shadow-md text-lg pointer-events-none">
            <div id="stage-display" class="bg-black/50 px-3 py-1 rounded-full border border-white/20">Stage: 1-1</div>
            <div id="death-display" class="bg-red-900/80 px-3 py-1 rounded-full border border-red-500/30 text-red-200">DEATHS: 0</div>
            <button id="btn-retry" onclick="restartStage()" class="pointer-events-auto bg-slate-800 hover:bg-slate-700 text-xs text-amber-300 font-bold px-3 py-1 rounded-full border border-amber-500/40 active:scale-95 transition">RETRY [R]</button>
        </div>

        <!-- 理不尽死亡メッセージオーバーレイ -->
        <div id="death-msg-overlay" class="absolute inset-0 z-20 flex flex-col items-center justify-center pointer-events-none opacity-0 transition-opacity duration-200">
            <div id="death-msg-text" class="text-3xl md:text-5xl font-black text-red-500 drop-shadow-[0_5px_5px_rgba(0,0,0,0.9)] bg-black/70 px-6 py-3 rounded-2xl border-2 border-red-600/60 transform -rotate-2">
                初見殺し！
            </div>
            <div class="text-white font-mono text-sm mt-2 bg-black/60 px-3 py-1 rounded">＼(^o^)／ オワタ</div>
        </div>

        <!-- タッチコントローラー (画面上に重ねて表示) -->
        <div class="relative z-20 flex justify-between items-end p-4 mb-2 pointer-events-none">
            <!-- 十字キー (左右) -->
            <div class="flex gap-3 pointer-events-auto">
                <button id="btn-left" class="touch-btn w-16 h-16 rounded-2xl flex items-center justify-center text-3xl font-black text-white active:scale-95 transition-transform">←</button>
                <button id="btn-right" class="touch-btn w-16 h-16 rounded-2xl flex items-center justify-center text-3xl font-black text-white active:scale-95 transition-transform">→</button>
            </div>
            <!-- ジャンプボタン -->
            <div class="pointer-events-auto">
                <button id="btn-jump" class="touch-btn w-20 h-20 rounded-full flex items-center justify-center text-xl font-extrabold text-white bg-gradient-to-tr from-amber-500/40 to-yellow-300/40 border-yellow-300/60 active:scale-95 transition-transform">JUMP</button>
            </div>
        </div>

        <!-- スタート＆ゲームオーバーダイアログ -->
        <div id="overlay-screen" class="absolute inset-0 z-30 bg-black/80 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
            <h1 id="screen-title" class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-amber-400 to-yellow-300 mb-2">インベーダーV</h1>
            <p id="screen-subtitle" class="text-gray-300 mb-6 max-w-md text-sm md:text-base leading-relaxed">
                罠だらけのステージを攻略せよ！触れると即死。常識を疑うことがクリアへの第一歩。
            </p>
            <button id="start-btn" class="bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-black text-xl py-4 px-10 rounded-full shadow-lg transform transition active:scale-95 border border-amber-300/40">
                START
            </button>
        </div>
    </div>

    <script>
        /* ----------------------------------------------------
           Web Audio API による効果音生成エンジン
        ---------------------------------------------------- */
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playJump() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            playDeath() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playBlockHit() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.setValueAtTime(800, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
            playExplode() {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(20, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
            playClear() {
                if (!this.ctx) return;
                let notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime + idx * 0.1);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.2);
                });
            }
        }

        const sound = new SoundEngine();

        /* ----------------------------------------------------
           定数・ゲーム状態変数
        ---------------------------------------------------- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const V_WIDTH = 800;  // 仮想画面幅
        const V_HEIGHT = 450; // 仮想画面高さ
        const TILE_SIZE = 32;

        let deaths = 0;
        let currentStageIdx = 0;
        let gameState = 'START'; // START, PLAYING, GAMEOVER, CLEAR
        let cameraX = 0;

        // 入力管理
        const keys = { left: false, right: false, jump: false };

        /* ----------------------------------------------------
           プレイヤーオブジェクト
        ---------------------------------------------------- */
        const player = {
            x: 50,
            y: 300,
            w: 24,
            h: 30,
            vx: 0,
            vy: 0,
            speed: 3.5,
            jumpForce: -13.5,
            gravity: 0.45,
            grounded: false,
            faceRight: true,
            isDead: false,
            jumpBufferTimer: 0, // ジャンプ先行入力（予約）タイマー
            reset() {
                this.x = 50;
                this.y = 300;
                this.vx = 0;
                this.vy = 0;
                this.grounded = false;
                this.isDead = false;
                this.jumpBufferTimer = 0;
            },
            update(level) {
                if (this.isDead) return;

                // 左右移動
                if (keys.left) {
                    this.vx = -this.speed;
                    this.faceRight = false;
                } else if (keys.right) {
                    this.vx = this.speed;
                    this.faceRight = true;
                } else {
                    this.vx = 0;
                }

                // ジャンプ予約（入力バッファ）更新
                if (keys.jump) {
                    this.jumpBufferTimer = 8; // 空中などで押してから約8フレーム間ジャンプ入力を保持
                } else if (this.jumpBufferTimer > 0) {
                    this.jumpBufferTimer--;
                }

                // 重力計算
                this.vy += this.gravity;

                // X移動＆当たり判定
                this.x += this.vx;
                this.checkCollisionX(level);

                // Y移動＆当たり判定
                this.y += this.vy;
                this.checkCollisionY(level);

                // 接地していて、かつジャンプ予約（または現在入力中）がある場合は即座にジャンプを実行
                if (this.grounded && (keys.jump || this.jumpBufferTimer > 0)) {
                    this.vy = this.jumpForce;
                    this.grounded = false;
                    this.jumpBufferTimer = 0;
                    sound.playJump();
                }

                // 落下死判定
                if (this.y > V_HEIGHT + 100) {
                    this.kill('穴に落ちた！');
                }
            },
            checkCollisionX(level) {
                for (let b of level.blocks) {
                    if (b.hidden && !b.revealed) continue;
                    if (isColliding(this, b)) {
                        if (b.isHazard) { this.kill(); return; }
                        if (this.vx > 0) {
                            this.x = b.x - this.w;
                        } else if (this.vx < 0) {
                            this.x = b.x + b.w;
                        }
                    }
                }
            },
            checkCollisionY(level) {
                this.grounded = false;
                for (let b of level.blocks) {
                    if (b.hidden && !b.revealed) {
                        // 【ステージ5・6限定】上から踏むと実体化する隠し足場
                        if ((level.idx === 4 || (level.idx === 5 && b.isStepType)) && this.vy > 0 && 
                            (this.y + this.h - this.vy) <= b.y + 12 && 
                            (this.y + this.h) >= b.y &&
                            this.x + this.w > b.x && this.x < b.x + b.w) {
                            b.revealed = true;
                            b.hidden = false;
                            this.y = b.y - this.h;
                            this.vy = 0;
                            this.grounded = true;
                            sound.playBlockHit();
                        }
                        // 【頭突きで出現する隠しブロック】
                        else if ((level.idx !== 4 && (!b.isStepType)) && this.vy < 0 && 
                            this.x + this.w > b.x && this.x < b.x + b.w &&
                            this.y <= b.y + b.h && this.y >= b.y) {
                            b.revealed = true;
                            b.hidden = false;
                            this.vy = 0;
                            this.y = b.y + b.h;
                            sound.playBlockHit();
                        }
                        continue;
                    }

                    if (isColliding(this, b)) {
                        if (b.isHazard) { this.kill(); return; }

                        if (this.vy >= 0 && (this.y + this.h - Math.max(0, this.vy)) <= b.y + 16) { // 着地
                            this.y = b.y - this.h;
                            this.vy = 0;
                            this.grounded = true;

                            // 踏むと壊れる/落ちる床・爆発ブロック
                            if (b.type === 'crumble' && !b.triggered) {
                                b.triggered = true;
                                b.vy = 2;
                            }
                            if (b.type === 'explode') {
                                b.exploded = true;
                                sound.playExplode();
                                this.kill('爆発に巻き込まれた！');
                            }
                        } else if (this.vy < 0) { // 頭突き
                            this.y = b.y + b.h;
                            this.vy = 0;
                            if (b.type === 'explode') {
                                b.exploded = true;
                                sound.playExplode();
                                this.kill('爆発ブロックを突いた！');
                            }
                        }
                    }
                }
            },
            kill(reason = '') {
                if (this.isDead) return;
                this.isDead = true;
                deaths++;
                sound.playDeath();
                showDeathMessage(reason);
                updateUI();
                setTimeout(() => {
                    restartStage();
                }, 700);
            },
            draw(ctx) {
                if (this.isDead) return;
                ctx.save();
                ctx.translate(this.x, this.y);

                // しょぼん（白い顔）風の描画
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, this.w, this.h);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, this.w, this.h);

                // 目と口
                ctx.fillStyle = '#000000';
                if (this.faceRight) {
                    // (`･ω･´)
                    ctx.fillText('´', 2, 10);
                    ctx.fillText('･', 6, 12);
                    ctx.fillText('ω', 11, 15);
                    ctx.fillText('･', 16, 12);
                    ctx.fillText('´', 20, 10);
                } else {
                    ctx.fillText('´', 2, 10);
                    ctx.fillText('･', 6, 12);
                    ctx.fillText('ω', 11, 15);
                    ctx.fillText('･', 16, 12);
                    ctx.fillText('´', 20, 10);
                }
                ctx.restore();
            }
        };

        function isColliding(r1, r2) {
            return r1.x < r2.x + r2.w &&
                   r1.x + r1.w > r2.x &&
                   r1.y < r2.y + r2.h &&
                   r1.y + r1.h > r2.y;
        }

        /* ----------------------------------------------------
           理不尽メッセージ生成エンジン
        ---------------------------------------------------- */
        const deathMessages = [
            '知ってた', '初見殺し！', 'はい、詰み', '常識を疑え',
            'そっちじゃない', '思い上がり乙', '無理ゲーｗｗ',
            '＼(^o^)／オワタ', '引っかかったな！', '罠でした〜'
        ];

        function showDeathMessage(customMsg) {
            const overlay = document.getElementById('death-msg-overlay');
            const textEl = document.getElementById('death-msg-text');
            const msg = customMsg || deathMessages[Math.floor(Math.random() * deathMessages.length)];
            textEl.innerText = msg;
            overlay.classList.remove('opacity-0');
            setTimeout(() => {
                overlay.classList.add('opacity-0');
            }, 650);
        }

        /* ----------------------------------------------------
           ステージデータ構造 & トラップギミック定義
        ---------------------------------------------------- */
        class Level {
            constructor(idx) {
                this.idx = idx;
                this.blocks = [];
                this.enemies = [];
                this.traps = [];
                this.goal = { x: 0, y: 0, w: 30, h: 50 };
                this.buildLevel(idx);
            }

            buildLevel(idx) {
                this.blocks = [];
                this.enemies = [];
                this.traps = [];

                const addFloor = (x, y, count) => {
                    for (let i = 0; i < count; i++) {
                        this.blocks.push({ x: (x + i) * TILE_SIZE, y: y * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'ground' });
                    }
                };

                if (idx === 0) { // --- STAGE 1 ---
                    addFloor(0, 12, 12);
                    addFloor(17, 12, 15);

                    // 1. 伸びる土管 (手前の空中に隠しブロックを絶対配置)
                    // 土管: X=10 (y=9, 伸びるとy=4に)
                    this.blocks.push({ x: 10 * TILE_SIZE, y: 9 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE * 3, type: 'pipe_extend', originalY: 9 * TILE_SIZE, targetY: 4 * TILE_SIZE, triggered: false });
                    
                    // 【重要】土管の手前(X=8, Y=7.5)の空中に隠しブロック！ここを叩いて足場にする
                    this.blocks.push({ x: 8 * TILE_SIZE, y: 7.5 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false });
                    // さらに二段ジャンプ用の第二隠しブロック(X=9, Y=4.5)
                    this.blocks.push({ x: 9 * TILE_SIZE, y: 4.5 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false });

                    // 2. 踏むと落ちる地面
                    this.blocks.push({ x: 12 * TILE_SIZE, y: 12 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'crumble', triggered: false, vy: 0 });
                    this.blocks.push({ x: 13 * TILE_SIZE, y: 12 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'crumble', triggered: false, vy: 0 });

                    // 3. 通ると落ちてくる空中足場
                    this.blocks.push({ x: 19 * TILE_SIZE, y: 5 * TILE_SIZE, w: TILE_SIZE * 3, h: TILE_SIZE, type: 'fall_under', triggered: false, vy: 0 });

                    // 4. 下から跳んでくる敵
                    this.enemies.push({ x: 14 * TILE_SIZE, y: 14 * TILE_SIZE, w: 24, h: 24, type: 'jumper', vy: 0, triggered: false, targetX: 12 * TILE_SIZE });

                    // 5. 右から飛んでくる横レス敵
                    this.enemies.push({ x: 28 * TILE_SIZE, y: 10 * TILE_SIZE, w: 24, h: 24, type: 'flyer', vx: 0, triggered: false, triggerX: 20 * TILE_SIZE });

                    this.goal = { x: 29 * TILE_SIZE, y: 10.5 * TILE_SIZE, w: 32, h: 48 };

                } else if (idx === 1) { // --- STAGE 2 ---
                    addFloor(0, 12, 8);
                    addFloor(13, 12, 14);

                    // 爆発ブロック
                    this.blocks.push({ x: 4 * TILE_SIZE, y: 9 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'explode', exploded: false });
                    
                    // 伸びる土管 + 手前下からの隠しブロック攻略
                    this.blocks.push({ x: 10 * TILE_SIZE, y: 8 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE * 4, type: 'pipe_extend', originalY: 8 * TILE_SIZE, targetY: 3 * TILE_SIZE, triggered: false });
                    // 土管の手前空中にある隠しブロック
                    this.blocks.push({ x: 7 * TILE_SIZE, y: 7 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false });
                    this.blocks.push({ x: 8.5 * TILE_SIZE, y: 4.5 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false });

                    // 天井落ち岩
                    this.blocks.push({ x: 15 * TILE_SIZE, y: 1 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE * 2, type: 'drop_ceiling', triggered: false, vy: 0, isHazard: true });

                    this.enemies.push({ x: 23 * TILE_SIZE, y: 11 * TILE_SIZE, w: 24, h: 24, type: 'flyer', vx: 0, triggered: false, triggerX: 16 * TILE_SIZE });

                    this.goal = { x: 24 * TILE_SIZE, y: 10.5 * TILE_SIZE, w: 32, h: 48 };

                } else if (idx === 2) { // --- STAGE 3 ---
                    addFloor(0, 12, 5);

                    // 伸びる土管＋手前の隠しブロックで空中ルートへ誘導
                    this.blocks.push({ x: 7 * TILE_SIZE, y: 7 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE * 5, type: 'pipe_extend', originalY: 7 * TILE_SIZE, targetY: 2 * TILE_SIZE, triggered: false });
                    this.blocks.push({ x: 5 * TILE_SIZE, y: 6 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false });

                    // 浮遊崩れる足場群
                    for (let i = 0; i < 4; i++) {
                        this.blocks.push({ x: (10 + i * 3) * TILE_SIZE, y: (8 - i % 2) * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE, type: 'crumble', triggered: false, vy: 0 });
                    }

                    // 急降下落下ブロック（幅を3マスから1.5マス分へ小さく変更）
                    this.blocks.push({ x: 21 * TILE_SIZE, y: 2 * TILE_SIZE, w: TILE_SIZE * 1.5, h: TILE_SIZE, type: 'fall_under', triggered: false, vy: 0, isHazard: true });

                    addFloor(22, 12, 6);
                    this.goal = { x: 26 * TILE_SIZE, y: 10.5 * TILE_SIZE, w: 32, h: 48 };

                } else if (idx === 3) { // --- STAGE 4 ---
                    addFloor(0, 12, 6);

                    // 溶岩上崩れる床
                    this.blocks.push({ x: 7 * TILE_SIZE, y: 11 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE, type: 'crumble', triggered: false, vy: 0 });
                    this.enemies.push({ x: 8 * TILE_SIZE, y: 15 * TILE_SIZE, w: 24, h: 24, type: 'jumper', vy: 0, triggered: false, targetX: 6 * TILE_SIZE });

                    // 【変更】伸びない普通の土管
                    this.blocks.push({ x: 13 * TILE_SIZE, y: 8 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE * 4, type: 'pipe_normal' });
                    
                    // 【追加】土管から少しずらした位置（X=14.5）に少し遅れて落ちてくる落下障害物
                    this.blocks.push({ x: 14.5 * TILE_SIZE, y: -2 * TILE_SIZE, w: TILE_SIZE * 1.5, h: TILE_SIZE, type: 'delay_fall', triggered: false, delayTimer: 0, vy: 0, isHazard: true });

                    // 罠と本物の隠しブロック
                    this.blocks.push({ x: 10 * TILE_SIZE, y: 7 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'explode', hidden: true, revealed: false }); // 罠爆発ブロック
                    this.blocks.push({ x: 11 * TILE_SIZE, y: 5 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false }); // 本物隠しブロック

                    addFloor(16, 12, 10);
                    this.goal = { x: 24 * TILE_SIZE, y: 10.5 * TILE_SIZE, w: 32, h: 48 };

                } else if (idx === 4) { // --- STAGE 5 ---
                    addFloor(0, 12, 4);

                    // 高速横切り敵
                    this.enemies.push({ x: 25 * TILE_SIZE, y: 11 * TILE_SIZE, w: 24, h: 24, type: 'flyer', vx: 0, speed: -9, triggered: false, triggerX: 2 * TILE_SIZE });

                    // 【修正】最初の土管の手前に設置された透明な足場 (高さを通常の1マス分にして判定を安定化)
                    this.blocks.push({ x: 5 * TILE_SIZE, y: 9.5 * TILE_SIZE, w: TILE_SIZE * 1.5, h: TILE_SIZE, type: 'block', hidden: true, revealed: false, isStepType: true });

                    // 伸びる超高層土管
                    this.blocks.push({ x: 11 * TILE_SIZE, y: 8 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE * 4, type: 'pipe_extend', originalY: 8 * TILE_SIZE, targetY: 1 * TILE_SIZE, triggered: false });

                    // 隠しブロックの連続階段
                    this.blocks.push({ x: 7 * TILE_SIZE, y: 8 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false });
                    this.blocks.push({ x: 8 * TILE_SIZE, y: 5.5 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false });
                    this.blocks.push({ x: 9.5 * TILE_SIZE, y: 2.5 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false });

                    // 崩れるゴール前ラッシュ
                    for (let i = 0; i < 5; i++) {
                        this.blocks.push({ x: (15 + i * 2) * TILE_SIZE, y: (7 - (i % 2)) * TILE_SIZE, w: TILE_SIZE * 1.5, h: TILE_SIZE, type: 'crumble', triggered: false, vy: 0 });
                    }

                    addFloor(26, 12, 6);
                    this.goal = { x: 30 * TILE_SIZE, y: 10.5 * TILE_SIZE, w: 32, h: 48 };

                } else if (idx === 5) { // --- STAGE 6 (FINAL ALL-STAR STAGE) ---
                    // 全長約60マスの超ロング＆鬼畜総集編ステージ
                    
                    // SECTION 1: STAGE 1 AREA (伸びる土管 + 隠し頭突きブロック)
                    addFloor(0, 12, 6);
                    this.blocks.push({ x: 8 * TILE_SIZE, y: 9 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE * 3, type: 'pipe_extend', originalY: 9 * TILE_SIZE, targetY: 4 * TILE_SIZE, triggered: false });
                    this.blocks.push({ x: 6 * TILE_SIZE, y: 7.5 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false });
                    this.blocks.push({ x: 7 * TILE_SIZE, y: 4.5 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false });

                    // SECTION 2: STAGE 2 AREA (爆発ブロック & 急降下落下物)
                    this.blocks.push({ x: 11 * TILE_SIZE, y: 11 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE, type: 'crumble', triggered: false, vy: 0 });
                    this.blocks.push({ x: 14 * TILE_SIZE, y: 8 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'explode', exploded: false });
                    
                    // 下から跳んでくる敵
                    this.enemies.push({ x: 18 * TILE_SIZE, y: 14 * TILE_SIZE, w: 24, h: 24, type: 'jumper', vy: 0, triggered: false, targetX: 13 * TILE_SIZE });

                    // 【追加】跳ね上がる敵と落下障害物の間に設置された「乗ると実体化する隠し足場」
                    this.blocks.push({ x: 15.5 * TILE_SIZE, y: 9.5 * TILE_SIZE, w: TILE_SIZE * 1.5, h: TILE_SIZE, type: 'block', hidden: true, revealed: false, isStepType: true });

                    // 天井落ち岩（急降下落下物）
                    this.blocks.push({ x: 17 * TILE_SIZE, y: 1 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE, type: 'drop_ceiling', triggered: false, vy: 0, isHazard: true });

                    // SECTION 3: STAGE 3 AREA (連続崩れる足場 & 通ると落ちる空中天井)
                    for (let i = 0; i < 3; i++) {
                        this.blocks.push({ x: (20 + i * 3) * TILE_SIZE, y: (8 - i) * TILE_SIZE, w: TILE_SIZE * 1.5, h: TILE_SIZE, type: 'crumble', triggered: false, vy: 0 });
                    }
                    // 2個目の落ちてくる障害物の初期Y位置を 2 * TILE_SIZE から -2 * TILE_SIZE へ高く変更
                    this.blocks.push({ x: 26 * TILE_SIZE, y: -2 * TILE_SIZE, w: TILE_SIZE * 1.2, h: TILE_SIZE, type: 'fall_under', triggered: false, vy: 0, isHazard: true });

                    // SECTION 4: STAGE 4 AREA (時間差落下障害物 + 超高速横切り敵)
                    addFloor(29, 12, 4);
                    this.blocks.push({ x: 34 * TILE_SIZE, y: 8 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE * 4, type: 'pipe_normal' });
                    this.blocks.push({ x: 35.5 * TILE_SIZE, y: -2 * TILE_SIZE, w: TILE_SIZE * 1.5, h: TILE_SIZE, type: 'delay_fall', triggered: false, delayTimer: 0, vy: 0, isHazard: true });
                    this.enemies.push({ x: 45 * TILE_SIZE, y: 11 * TILE_SIZE, w: 24, h: 24, type: 'flyer', vx: 0, speed: -11, triggered: false, triggerX: 30 * TILE_SIZE });

                    // SECTION 5: STAGE 5 AREA (踏む透明足場 & 伸びる超巨大土管 + 罠ブロック)
                    this.blocks.push({ x: 38 * TILE_SIZE, y: 9.5 * TILE_SIZE, w: TILE_SIZE * 1.5, h: TILE_SIZE, type: 'block', hidden: true, revealed: false, isStepType: true });
                    this.blocks.push({ x: 44 * TILE_SIZE, y: 8 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE * 4, type: 'pipe_extend', originalY: 8 * TILE_SIZE, targetY: 0 * TILE_SIZE, triggered: false });
                    
                    // 【追加】土管と土管の間（真ん中）に配置された「踏むと実体化する隠し足場」
                    this.blocks.push({ x: 41 * TILE_SIZE, y: 8.5 * TILE_SIZE, w: TILE_SIZE * 1.5, h: TILE_SIZE, type: 'block', hidden: true, revealed: false, isStepType: true });

                    this.blocks.push({ x: 40 * TILE_SIZE, y: 7.5 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false });
                    this.blocks.push({ x: 42.5 * TILE_SIZE, y: 2.0 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'block', hidden: true, revealed: false }); // 本物

                    // FINAL RUSH: 超絶高難易度の足場と連続ジャンプ
                    for (let i = 0; i < 4; i++) {
                        this.blocks.push({ x: (48 + i * 2) * TILE_SIZE, y: (6 + (i % 2) * 2) * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'crumble', triggered: false, vy: 0 });
                    }

                    addFloor(57, 12, 5);
                    this.goal = { x: 60 * TILE_SIZE, y: 10.5 * TILE_SIZE, w: 32, h: 48 };
                }
            }

            update() {
                // 1. ブロック・ギミックの更新
                for (let b of this.blocks) {
                    // 伸びる土管の挙動
                    if (b.type === 'pipe_extend') {
                        let dist = Math.abs((player.x + player.w / 2) - (b.x + b.w / 2));
                        if (dist < TILE_SIZE * 3 && player.y > b.y - TILE_SIZE * 3) {
                            b.triggered = true;
                        }
                        if (b.triggered && b.y > b.targetY) {
                            const growSpeed = 3;
                            b.y -= growSpeed;
                            b.h += growSpeed;

                            // 【追加】土管が伸長中、プレイヤーが土管に乗っている場合は一緒に押し上げる
                            if (player.x + player.w > b.x && player.x < b.x + b.w && 
                                Math.abs((player.y + player.h) - b.y) <= growSpeed + 4) {
                                player.y = b.y - player.h;
                                player.vy = 0;
                                player.grounded = true;
                            }
                        }
                    }
                    // 通ると落ちる足場
                    if (b.type === 'fall_under') {
                        if (!b.triggered && player.x + player.w > b.x && player.x < b.x + b.w && player.y > b.y) {
                            b.triggered = true;
                        }
                        if (b.triggered) {
                            b.vy += 0.5;
                            b.y += b.vy;
                        }
                    }
                    // 天井落下ブロック
                    if (b.type === 'drop_ceiling') {
                        if (!b.triggered && Math.abs(player.x - b.x) < TILE_SIZE * 2) {
                            b.triggered = true;
                        }
                        if (b.triggered) {
                            b.vy += 0.6;
                            b.y += b.vy;
                        }
                    }
                    // 時間差落下障害物（ステージ4用）
                    if (b.type === 'delay_fall') {
                        if (!b.triggered && Math.abs(player.x - b.x) < TILE_SIZE * 2.5) {
                            b.triggered = true;
                        }
                        if (b.triggered) {
                            b.delayTimer++;
                            if (b.delayTimer > 12) { // わずかに遅れて落下
                                b.vy += 0.7;
                                b.y += b.vy;
                            }
                        }
                    }
                    // 崩れる床
                    if (b.type === 'crumble' && b.triggered) {
                        b.vy += 0.4;
                        b.y += b.vy;
                    }
                }

                // 2. 敵キャラの更新
                for (let e of this.enemies) {
                    if (e.type === 'jumper') {
                        if (!e.triggered && player.x > e.targetX) {
                            e.triggered = true;
                            e.vy = -12;
                        }
                        if (e.triggered) {
                            e.vy += 0.4;
                            e.y += e.vy;
                        }
                    }
                    if (e.type === 'flyer') {
                        if (!e.triggered && player.x > e.triggerX) {
                            e.triggered = true;
                            e.vx = e.speed || -6;
                        }
                        if (e.triggered) {
                            e.x += e.vx;
                        }
                    }

                    // プレイヤーと敵の当たり判定（即死）
                    if (isColliding(player, e)) {
                        player.kill('敵に接触した！');
                    }
                }

                // ゴール到達判定
                if (isColliding(player, this.goal)) {
                    sound.playClear();
                    nextStage();
                }
            }

            draw(ctx) {
                // ブロック描画
                for (let b of this.blocks) {
                    if (b.hidden && !b.revealed) continue;

                    if (b.type === 'ground') {
                        ctx.fillStyle = '#4a5568';
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.strokeStyle = '#2d3748';
                        ctx.strokeRect(b.x, b.y, b.w, b.h);
                    } else if (b.type === 'block') {
                        ctx.fillStyle = '#d69e2e';
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.strokeStyle = '#b7791f';
                        ctx.strokeRect(b.x, b.y, b.w, b.h);
                    } else if (b.type.startsWith('pipe')) {
                        ctx.fillStyle = '#38a169';
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.fillStyle = '#2f855a';
                        ctx.fillRect(b.x - 2, b.y, b.w + 4, 12);
                        ctx.strokeStyle = '#1c4532';
                        ctx.strokeRect(b.x, b.y, b.w, b.h);
                    } else if (b.type === 'crumble') {
                        ctx.fillStyle = '#a0aec0';
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.strokeStyle = '#718096';
                        ctx.strokeRect(b.x, b.y, b.w, b.h);
                    } else if (b.type === 'explode') {
                        ctx.fillStyle = b.exploded ? '#e53e3e' : '#dd6b20';
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = '12px sans-serif';
                        ctx.fillText('💣', b.x + 8, b.y + 20);
                    } else if (b.type === 'fall_under' || b.type === 'drop_ceiling' || b.type === 'delay_fall') {
                        ctx.fillStyle = '#742a2a';
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.strokeStyle = '#9b2c2c';
                        ctx.strokeRect(b.x, b.y, b.w, b.h);
                    }
                }

                // 敵描画
                for (let e of this.enemies) {
                    ctx.fillStyle = '#e53e3e';
                    ctx.beginPath();
                    ctx.arc(e.x + e.w / 2, e.y + e.h / 2, e.w / 2, 0, Math.PI * 2);
                    ctx.fill();
                    // 敵の目
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(e.x + 4, e.y + 6, 4, 4);
                    ctx.fillRect(e.x + 14, e.y + 6, 4, 4);
                }

                // ゴール描画
                ctx.fillStyle = '#ecc94b';
                ctx.fillRect(this.goal.x, this.goal.y, this.goal.w, this.goal.h);
                ctx.fillStyle = '#3182ce';
                ctx.fillRect(this.goal.x + 4, this.goal.y + 4, this.goal.w - 8, this.goal.h - 8);
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px sans-serif';
                ctx.fillText('GOAL', this.goal.x + 2, this.goal.y + 28);
            }
        }

        let currentLevel = null;

        /* ----------------------------------------------------
           ループ＆コントロール処理
        ---------------------------------------------------- */
        function initGame() {
            setupInput();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = V_WIDTH;
            canvas.height = V_HEIGHT;
        }

        function startStage() {
            sound.init();
            currentLevel = new Level(currentStageIdx);
            player.reset();
            gameState = 'PLAYING';
            document.getElementById('overlay-screen').classList.add('hidden');
            updateUI();
        }

        function restartStage() {
            if (gameState !== 'PLAYING' && gameState !== 'GAMEOVER') return;
            currentLevel = new Level(currentStageIdx);
            player.reset();
            gameState = 'PLAYING';
        }

        function nextStage() {
            currentStageIdx++;
            if (currentStageIdx >= 6) {
                // 全6ステージ完全クリア時の演出・表示
                gameState = 'CLEAR';
                document.getElementById('screen-title').innerText = '🎉 ゲームクリア！';
                document.getElementById('screen-subtitle').innerHTML = `<span class="text-xl md:text-2xl font-bold text-yellow-300 block mb-2">おめでとう！</span>あなたは <span class="text-red-400 font-extrabold text-2xl md:text-3xl">${deaths}</span> 回死んで全てをクリアしました！`;
                document.getElementById('overlay-screen').classList.remove('hidden');
                document.getElementById('start-btn').innerText = '最初から挑戦する';
                currentStageIdx = 0;
            } else {
                startStage();
            }
        }

        function updateUI() {
            document.getElementById('stage-display').innerText = `Stage: 1-${currentStageIdx + 1}`;
            document.getElementById('death-display').innerText = `DEATHS: ${deaths}`;
        }

        // 入力イベント設定
        function setupInput() {
            // キーボード
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
                if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') keys.jump = true;
                if (e.key === 'r' || e.key === 'R') restartStage();
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
                if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') keys.jump = false;
            });

            // タッチ操作
            const bindTouch = (btnId, keyName) => {
                const btn = document.getElementById(btnId);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
                btn.addEventListener('mousedown', () => { keys[keyName] = true; });
                btn.addEventListener('mouseup', () => { keys[keyName] = false; });
            };

            bindTouch('btn-left', 'left');
            bindTouch('btn-right', 'right');
            bindTouch('btn-jump', 'jump');

            document.getElementById('start-btn').addEventListener('click', () => {
                startStage();
            });
        }

        // メインループ
        function gameLoop() {
            ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

            if (gameState === 'PLAYING' && currentLevel) {
                // カメラスクロール更新
                cameraX = Math.max(0, player.x - V_WIDTH / 3);

                ctx.save();
                ctx.translate(-cameraX, 0);

                // 更新
                player.update(currentLevel);
                currentLevel.update();

                // 描画
                currentLevel.draw(ctx);
                player.draw(ctx);

                ctx.restore();
            }

            requestAnimationFrame(gameLoop);
        }

        window.onload = initGame;
    </script>
</body>
